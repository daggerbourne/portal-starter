name: verdicts
on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]
  pull_request_review:
  issue_comment:
permissions:
  contents: read
  pull-requests: read
jobs:
  verdicts:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_review' && github.event.review.user.login == 'crew-review[bot]') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, 'verdict-code'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types .github/verdicts/check.ts
