name: db-dev-migrate
on: {push: {branches: [main], paths: ["db/**"]}}
permissions: {contents: read}
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: neon
    env: {EVENT_BEFORE: "${{ github.event.before }}", EVENT_SHA: "${{ github.sha }}", APP_DEV_DATABASE_URL: "${{ secrets.APP_DEV_DATABASE_URL }}"}
    steps:
      - {uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262, with: {ref: main, persist-credentials: false, fetch-depth: "0"}}
      - {uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020, with: {node-version-file: .nvmrc}}
      - {run: npm ci}
      - {run: npx tsx .github/db-copies/run.ts dev-migrate}
