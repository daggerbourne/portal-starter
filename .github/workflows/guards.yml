name: guards
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: "guards-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  ci-permissions:
    name: ci-permissions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        with:
          fetch-depth: "0"
          persist-credentials: false
      - name: setup node
        uses: "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020"
        with:
          node-version-file: .nvmrc
      - name: install
        run: npm ci
      - name: plan
        id: plan
        run: node --experimental-strip-types .github/guards/check.ts plan
        env:
          EVENT_NAME: "${{ github.event_name }}"
          EVENT_BEFORE: "${{ github.event.before }}"
          PR_BASE: "${{ github.event.pull_request.base.sha }}"
          HEAD_SHA: "${{ github.sha }}"
      - name: ci-permissions
        if: "success() && steps.plan.outputs.depth == 'full'"
        run: node --experimental-strip-types .github/guards/check.ts ci-permissions
  adapter-mode:
    name: adapter-mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        with:
          fetch-depth: "0"
          persist-credentials: false
      - name: setup node
        uses: "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020"
        with:
          node-version-file: .nvmrc
      - name: plan
        id: plan
        run: node --experimental-strip-types .github/guards/adapter-mode.ts plan
        env:
          EVENT_NAME: "${{ github.event_name }}"
          EVENT_BEFORE: "${{ github.event.before }}"
          PR_BASE: "${{ github.event.pull_request.base.sha }}"
          HEAD_SHA: "${{ github.sha }}"
      - name: adapter-mode
        if: "success() && steps.plan.outputs.depth == 'full'"
        run: node --experimental-strip-types .github/guards/adapter-mode.ts
