name: db-sweep
on:
  schedule: [{cron: "0 9 * * *"}]
  workflow_dispatch:
permissions: {contents: read, pull-requests: read}
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: neon
    env: {GITHUB_REPOSITORY: "${{ github.repository }}", GITHUB_TOKEN: "${{ github.token }}", NEON_API_KEY: "${{ secrets.NEON_API_KEY }}", NETLIFY_AUTH_TOKEN: "${{ secrets.NETLIFY_AUTH_TOKEN }}", NEON_PROJECT_ID: "${{ vars.NEON_PROJECT_ID }}", NETLIFY_SITE_ID: "${{ vars.NETLIFY_SITE_ID }}"}
    steps:
      - {uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262, with: {ref: main, persist-credentials: false}}
      - {uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020, with: {node-version-file: .nvmrc}}
      - {run: npm ci}
      - {run: npx tsx .github/db-copies/run.ts sweep}
